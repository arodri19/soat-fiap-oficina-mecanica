name: CI — Build, Testes e Imagem Docker

on:
  workflow_dispatch:

env:
  NODE_VERSION:       '20'
  DOCKERHUB_REPOSITORY: arodri19/oficina-mecanica-app

jobs:
  # ── Job 1: Testes Automatizados ───────────────────────────────────────────
  test:
    name: Testes Unitários e Cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com cobertura
        run: npm test -- --coverage --ci --forceExit
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          JWT_SECRET:   "ci-secret-placeholder"

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Resumo de cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              console.log('### Cobertura de Testes');
              console.log('| Métrica | % |');
              console.log('|---------|---|');
              ['lines','statements','functions','branches'].forEach(k =>
                console.log('| ' + k + ' | ' + s[k].pct + '% |')
              );
            " >> $GITHUB_STEP_SUMMARY
          fi

  # ── Job 2: Build e Push no Docker Hub ──────────────────────────────────────
  # Executa somente quando disparado manualmente na main (após testes passarem).
  # Gera tag imutável com SHA curto + tag 'latest' para conveniência.
  # Repositório público — não requer autenticação para pull (ver DOCKERHUB_REPOSITORY).
  build-and-push:
    name: Build e Push no Docker Hub
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: oficina-prd

    permissions:
      contents: read

    outputs:
      image-uri: ${{ steps.push.outputs.image-uri }}
      image-tag: ${{ steps.tag.outputs.short-sha }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4.2.2

      - name: Login no Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calcular tag (SHA curto do commit)
        id: tag
        run: |
          echo "short-sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker
        id: build
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.short-sha }}
        run: |
          IMAGE="${{ env.DOCKERHUB_REPOSITORY }}:$IMAGE_TAG"
          LATEST="${{ env.DOCKERHUB_REPOSITORY }}:latest"

          docker build \
            --cache-from "type=registry,ref=$LATEST" \
            --cache-to   "type=inline" \
            --tag "$IMAGE" \
            --tag "$LATEST" \
            .

          echo "image-uri=$IMAGE" >> $GITHUB_OUTPUT
          echo "latest-uri=$LATEST" >> $GITHUB_OUTPUT

      # Só executa se o step de build acima terminou com sucesso — garante
      # que nenhuma imagem é publicada sem antes ter sido buildada.
      - name: Push para o Docker Hub
        id: push
        if: success()
        run: |
          docker push "${{ steps.build.outputs.image-uri }}"
          docker push "${{ steps.build.outputs.latest-uri }}"

          echo "image-uri=${{ steps.build.outputs.image-uri }}" >> $GITHUB_OUTPUT

      - name: Resumo do build
        run: |
          echo "### Imagem publicada no Docker Hub 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| URI | \`${{ steps.push.outputs.image-uri }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag SHA | \`${{ steps.tag.outputs.short-sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
