name: CI — Build, Testes e Imagem Docker

on:
  workflow_dispatch:

env:
  NODE_VERSION:   '20'
  AWS_REGION:     ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: oficina-mecanica-app-fiap-andre-rq-20260707

jobs:
  # ── Job 1: Testes Automatizados ───────────────────────────────────────────
  test:
    name: Testes Unitários e Cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com cobertura
        run: npm test -- --coverage --ci --forceExit
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          JWT_SECRET:   "ci-secret-placeholder"

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Resumo de cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              console.log('### Cobertura de Testes');
              console.log('| Métrica | % |');
              console.log('|---------|---|');
              ['lines','statements','functions','branches'].forEach(k =>
                console.log('| ' + k + ' | ' + s[k].pct + '% |')
              );
            " >> $GITHUB_STEP_SUMMARY
          fi

  # ── Job 2: Build e Push no Amazon ECR ─────────────────────────────────────
  # Executa somente quando disparado manualmente na main (após testes passarem).
  # Gera tag imutável com SHA curto + tag 'latest' para conveniência.
  build-and-push:
    name: Build e Push no Amazon ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: oficina-prd

    permissions:
      contents: read

    outputs:
      image-uri: ${{ steps.push.outputs.image-uri }}
      image-tag: ${{ steps.tag.outputs.short-sha }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Criar repositório ECR se não existir
        run: |
          aws ecr describe-repositories \
            --repository-names ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true \
            --image-tag-mutability MUTABLE
          echo "Repositório ECR pronto."

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Calcular tag (SHA curto do commit)
        id: tag
        run: |
          echo "short-sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push para o ECR
        id: push
        env:
          REGISTRY:  ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.short-sha }}
        run: |
          IMAGE="$REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"
          LATEST="$REGISTRY/${{ env.ECR_REPOSITORY }}:latest"

          docker build \
            --cache-from "type=registry,ref=$LATEST" \
            --cache-to   "type=inline" \
            --tag "$IMAGE" \
            --tag "$LATEST" \
            .

          docker push "$IMAGE"
          docker push "$LATEST"

          echo "image-uri=$IMAGE" >> $GITHUB_OUTPUT

      - name: Resumo do build
        run: |
          echo "### Imagem publicada no Amazon ECR 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| URI | \`${{ steps.push.outputs.image-uri }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag SHA | \`${{ steps.tag.outputs.short-sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
