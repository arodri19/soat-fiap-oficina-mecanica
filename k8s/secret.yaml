apiVersion: v1
kind: Secret
metadata:
  name: oficina-secrets
  namespace: oficina-mecanica
  labels:
    app.kubernetes.io/name: oficina-mecanica
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgres"
  JWT_SECRET: "super-secret-change-me"
  DATABASE_URL: "postgresql://postgres:postgres@postgres-service:5432/oficina?schema=public"
