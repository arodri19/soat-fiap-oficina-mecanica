apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-app
  namespace: oficina-mecanica
  labels:
    app: oficina-app
    app.kubernetes.io/name: oficina-mecanica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: oficina-app
    spec:
      # initContainer executa as migrations antes de iniciar a aplicação.
      # prisma migrate deploy é idempotente e usa advisory locks no Postgres,
      # por isso é seguro rodar em paralelo quando múltiplos pods iniciam juntos.
      initContainers:
        - name: migrate
          image: arodri19/oficina-mecanica-app:latest
          imagePullPolicy: Always
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

      containers:
        - name: app
          image: arodri19/oficina-mecanica-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: PORT
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: CORS_ORIGIN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: JWT_SECRET
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: NEW_RELIC_LICENSE_KEY
            - name: NEW_RELIC_APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: NEW_RELIC_APP_NAME
            # Não é segredo — vai no Secret (não no ConfigMap estático) porque é
            # resolvido dinamicamente a cada deploy, igual DATABASE_URL (ver cd.yml).
            - name: API_GATEWAY_URL
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: API_GATEWAY_URL
                  optional: true
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: LOG_LEVEL

          # readinessProbe: pod só recebe tráfego após /health responder 200
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6

          # livenessProbe: reinicia o container se /health parar de responder
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "200m"
              memory: "192Mi"
