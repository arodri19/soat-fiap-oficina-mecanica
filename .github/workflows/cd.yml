name: CD — Deploy Kubernetes

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  # Disparo 100% manual — nenhum push/PR/conclusão de outro workflow aciona o CD.
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag da imagem Docker Hub (ex: abc1234 ou latest)'
        required: false
        default: 'latest'
      environment:
        description: 'Ambiente alvo'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]

# ── Variáveis globais ──────────────────────────────────────────────────────────
# Secrets (Settings → Secrets): AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
#                                DB_PASSWORD, JWT_SECRET, NEW_RELIC_LICENSE_KEY
# Variables (Settings → Variables): AWS_REGION, EKS_CLUSTER_NAME
#
# O cluster EKS (repositório infra-kube) e o RDS (repositório infra-data) são
# provisionados por seus próprios pipelines, fora deste repositório. Este workflow
# só faz o deploy da aplicação num cluster/banco que já existem — por isso
# EKS_CLUSTER_NAME é Variable, não output de Terraform local. O endpoint do RDS
# é resolvido dinamicamente via AWS CLI (step "Resolver endpoint do RDS") em vez
# de outra Variable — o identifier muda de instância a cada `terraform apply`
# do infra-data (skip_final_snapshot=true recria o recurso em vez de atualizar
# em alguns cenários), e uma Variable fixa ficaria desatualizada silenciosamente.
env:
  AWS_REGION:            ${{ vars.AWS_REGION || 'us-east-1' }}
  EKS_CLUSTER_NAME:      ${{ vars.EKS_CLUSTER_NAME || 'oficina-mecanica-dev' }}
  RDS_IDENTIFIER:        oficina-mecanica-${{ github.event.inputs.environment }}-postgres
  DOCKERHUB_REPOSITORY:  arodri19/oficina-mecanica-app
  NAMESPACE:             'oficina-mecanica'

jobs:
  # ── Guard ────────────────────────────────────────────────────────────────────
  # Disparo é sempre manual (workflow_dispatch) — deploy manual sempre autorizado.
  guard:
    name: Confirmar disparo manual
    runs-on: ubuntu-latest
    steps:
      - name: Deploy autorizado
        run: echo "✅ Disparado manualmente. Iniciando pipeline de CD."

  # ── Deploy no Kubernetes (EKS) ─────────────────────────────────────────────
  # 1. Configura kubectl via aws eks update-kubeconfig
  # 2. Resolve a tag da imagem no Docker Hub (input "image_tag" do workflow_dispatch)
  # 3. Substitui o placeholder no app-deployment.yaml
  # 4. Cria/atualiza o Secret K8s com credenciais reais (RDS endpoint)
  # 5. Aplica todos os manifestos por categoria (ordem importa)
  # 6. Aguarda rollout com timeout de 5 min
  deploy-k8s:
    name: Deploy no Kubernetes (EKS)
    runs-on: ubuntu-latest
    needs: guard
    environment: oficina-prd

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7.0.1

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Resolver endpoint do RDS
        run: |
          ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier "${{ env.RDS_IDENTIFIER }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "DBInstances[0].Endpoint.Address" --output text)

          if [ -z "$ENDPOINT" ] || [ "$ENDPOINT" = "None" ]; then
            echo "::error::RDS '${{ env.RDS_IDENTIFIER }}' não encontrado — rode o pipeline do infra-data antes deste."
            exit 1
          fi

          echo "RDS_ENDPOINT=$ENDPOINT" >> "$GITHUB_ENV"
          echo "Endpoint resolvido: $ENDPOINT"

      # Não é fatal como o RDS: o app funciona sem isso, só o Swagger de /auth/cpf e
      # /me (openapi.json) fica sem link clicável até o serverless ser implantado.
      - name: Resolver URL da API Gateway (Swagger de /auth/cpf e /me)
        run: |
          URL=$(aws apigatewayv2 get-apis --region "${{ env.AWS_REGION }}" \
            --query "Items[?Name=='oficina-mecanica-${{ github.event.inputs.environment }}-api'].ApiEndpoint | [0]" \
            --output text)

          if [ -z "$URL" ] || [ "$URL" = "None" ]; then
            echo "::warning::API Gateway não encontrada — rode o pipeline do serverless para o Swagger linkar /auth/cpf e /me corretamente."
          else
            echo "API_GATEWAY_URL=$URL" >> "$GITHUB_ENV"
            echo "URL resolvida: $URL"
          fi

      - name: Resolver URI da imagem no Docker Hub
        id: image
        run: |
          TAG="${{ github.event.inputs.image_tag }}"

          echo "tag=$TAG"                                >> $GITHUB_OUTPUT
          echo "uri=${{ env.DOCKERHUB_REPOSITORY }}:$TAG" >> $GITHUB_OUTPUT

      - name: Configurar kubectl (EKS)
        run: |
          aws eks update-kubeconfig \
            --region "${{ env.AWS_REGION }}" \
            --name   "${{ env.EKS_CLUSTER_NAME }}"

      - name: Atualizar tag da imagem no Deployment YAML
        run: |
          IMAGE="${{ steps.image.outputs.uri }}"
          # Substitui qualquer tag anterior pela nova (SHA ou latest)
          sed -i \
            "s|${{ env.DOCKERHUB_REPOSITORY }}:[^ ]*|${IMAGE}|g" \
            k8s/app-deployment.yaml
          echo "Imagem configurada: $IMAGE"

      # ── Aplicar manifestos por ordem de dependência ──────────────────────
      - name: Aplicar Namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Aplicar ConfigMap
        run: kubectl apply -f k8s/configmap.yaml

      - name: Criar/atualizar Secret com credenciais do RDS
        run: |
          DB_URL="postgresql://postgres:${{ secrets.DB_PASSWORD }}@${{ env.RDS_ENDPOINT }}/oficina?schema=public"

          kubectl create secret generic oficina-secrets \
            --namespace="${{ env.NAMESPACE }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=DATABASE_URL="$DB_URL" \
            --from-literal=NEW_RELIC_LICENSE_KEY="${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            --from-literal=API_GATEWAY_URL="${{ env.API_GATEWAY_URL }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Instalar metrics-server (necessário para HPA)
        run: |
          kubectl apply -f k8s/metrics-server.yaml
          kubectl rollout status deployment/metrics-server -n kube-system --timeout=120s

      - name: Aplicar Deployment, Service e HPA da aplicação
        run: |
          kubectl apply -f k8s/app-deployment.yaml
          kubectl apply -f k8s/app-service.yaml
          kubectl apply -f k8s/app-hpa.yaml

      # ── Verificações pós-deploy ──────────────────────────────────────────
      - name: Aguardar rollout do Deployment
        run: |
          kubectl rollout status deployment/oficina-app \
            --namespace="${{ env.NAMESPACE }}" \
            --timeout=300s

      - name: Resolver endereço público (Swagger)
        run: |
          echo "Aguardando o LoadBalancer do Service receber um endereço público..."
          for i in $(seq 1 30); do
            HOST=$(kubectl get svc oficina-app-service -n "${{ env.NAMESPACE }}" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [ -n "$HOST" ] && break
            sleep 10
          done

          if [ -z "$HOST" ]; then
            echo "::warning::LoadBalancer ainda sem endereço público após 5min — confira 'kubectl get svc' manualmente."
          else
            echo "APP_HOST=$HOST" >> "$GITHUB_ENV"
            echo "Endereço público: http://$HOST"
          fi

      - name: Executar seed do banco de dados
        run: |
          POD=$(kubectl get pods -n "${{ env.NAMESPACE }}" \
            -l app=oficina-app \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}')
          echo "Executando seed no pod: $POD"
          kubectl exec -n "${{ env.NAMESPACE }}" "$POD" -- node prisma/seed.js

      - name: Estado do cluster após deploy
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n "${{ env.NAMESPACE }}" -o wide
          echo ""
          echo "=== Services ==="
          kubectl get svc -n "${{ env.NAMESPACE }}"
          echo ""
          echo "=== HPA ==="
          kubectl get hpa -n "${{ env.NAMESPACE }}"
          echo ""
          echo "=== Events recentes ==="
          kubectl get events -n "${{ env.NAMESPACE }}" \
            --sort-by='.lastTimestamp' | tail -10

      - name: Resumo do deploy
        if: always()
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
          echo "### Deploy Kubernetes $EMOJI $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Imagem Docker Hub | \`${{ steps.image.outputs.uri }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.image.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster EKS | \`${{ env.EKS_CLUSTER_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| RDS Endpoint | \`${{ env.RDS_ENDPOINT }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | \`${{ env.NAMESPACE }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ env.APP_HOST }}" ]; then
            echo "| Swagger UI | http://${{ env.APP_HOST }}/api-docs |" >> $GITHUB_STEP_SUMMARY
            echo "| Healthcheck | http://${{ env.APP_HOST }}/health |" >> $GITHUB_STEP_SUMMARY
          fi
